<!doctype html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><style>
/* same look as the WP Image Grabber panel (github.com/masumbijoy/wp-image-grabber, grabber.js) */
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
html,body{margin:0;background:#fff}
body{width:390px;color:#1c1c1e;font-size:13px}
html.panel,html.panel body{overflow:hidden}
.h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #e6e6ea;background:#fff}
.h b{font-size:14px}
.v{font-weight:400;font-size:11px;color:#888;margin-left:4px}
.x{border:0;background:none;font-size:18px;cursor:pointer;color:#666}
.b{padding:12px 14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
label{display:block;font-size:11px;color:#555;margin-bottom:2px}
select,.key{width:100%;padding:6px 8px;border:1px solid #c8c8ce;border-radius:6px;font-size:13px;background:#fff;color:#1c1c1e}
.key{cursor:pointer;text-align:left;font-family:ui-monospace,Menlo,monospace}
.key.on{border-color:#1a73e8;color:#1a73e8}
.full{grid-column:1/-1}
.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:#333;margin:2px 0}
.chk label{margin:0;font-size:12px;color:#333}
.chk #host{color:#888}
.acts{display:flex;gap:10px;margin-top:3px}
.lnk{border:0;background:none;padding:0;color:#1a73e8;font-size:11px;cursor:pointer}
.muted{color:#777;font-size:11px;margin-top:6px}
.muted:empty{display:none}
.muted.err{color:#d93025}
.log{margin-top:10px;background:#f6f6f8;border-radius:6px;padding:6px 8px;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#333}
@media (prefers-color-scheme:dark){
  html,body,.h{background:#1f1f23;color:#eee}.h{border-color:#3a3a40}
  select,.key{background:#2a2a2f;color:#eee;border-color:#44444a}
  label,.chk label{color:#bbb}.log{background:#2a2a2f;color:#ddd}.muted{color:#999}.x{color:#aaa}
  .muted.err{color:#f28b82}
}
</style></head><body>
<div class="h"><b>Writing Assistant <span class="v" id="ver"></span></b><button class="x" id="close" title="Close">×</button></div>
<div class="b">
  <div class="g">
    <div><label for="voiceLang">Voice language</label>
      <select id="voiceLang"><option value="bn-BD">Bangla (Bangladesh)</option><option value="bn-IN">Bangla (India)</option></select></div>
    <div><label for="language">Text language</label>
      <select id="language">
        <option value="auto">Auto-detect</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="de-DE">German</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
      </select></div>
    <div><label>Shortcut: Bangla → English</label>
      <button id="scBox" class="key" title="Click, then press your keys">…</button>
      <div class="acts"><button id="scOff" class="lnk">Turn off</button><button id="scReset" class="lnk">Reset</button></div></div>
    <div><label>Shortcut: Bangla → Bangla</label>
      <button id="scBoxBn" class="key" title="Click, then press your keys">…</button>
      <div class="acts"><button id="scOffBn" class="lnk">Turn off</button><button id="scResetBn" class="lnk">Reset</button></div></div>
    <div class="full">
      <div class="chk"><input type="checkbox" id="enabled"><label for="enabled">Enabled</label></div>
      <div class="chk" id="siteRow" hidden><input type="checkbox" id="site"><label for="site">On this site <span id="host"></span></label></div>
      <div class="chk"><input type="checkbox" id="tone"><label for="tone">Professional &amp; polite tone</label></div>
      <div class="chk"><input type="checkbox" id="picky"><label for="picky">Style suggestions (picky mode)</label></div>
      <div class="chk"><input type="checkbox" id="autoFix"><label for="autoFix">Auto-fix spelling mistakes</label></div>
    </div>
  </div>
  <div class="muted" id="scMsg"></div>
  <div class="muted" id="scMsgBn"></div>
  <div class="log">Voice shortcuts work in any text box. Click a shortcut, then press your keys. Text is checked by api.languagetool.org; voice uses Chrome speech recognition and MyMemory translation.</div>
</div>
<script src="shortcut.js"></script>
<script src="popup.js"></script>
</body></html>
